<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JS Fishing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <!-- UI Layer -->
    <div id="ui-layer">
        <div>Gold: <span id="gold-display">0</span></div>
        <div>Rod: <span id="rod-display">Basic Rod</span></div>
        <div>Bait: <span id="bait-display">Small Bait</span></div>
        <div>Inventory: <span id="inventory-display">Small: 0, Medium: 0, Large: 0</span></div>
        <div>Controls: Arrow Keys/WASD to move boat | Mouse to cast | R to upgrade rod</div>
        <div style="font-size: 12px; color: #aaa;">Tip: Catch fish and upgrade bait to catch bigger fish!</div>
    </div>
    
    <!-- Fish Decision Modal -->
    <div id="fish-modal" class="hidden">
        <div class="modal-content">
            <h2>Fish Caught!</h2>
            <p id="fish-info"></p>
            <div class="button-group">
                <button id="sell-btn">Sell Fish (+<span id="sell-amount">0</span> gold)</button>
                <button id="upgrade-btn">Upgrade to <span id="upgrade-name">Medium Bait</span></button>
            </div>
        </div>
    </div>
    
    <script type="module" src="js/main.js"></script>
</body>
</html>
