<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JS Fishing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <!-- UI Layer -->
    <div id="ui-layer">
        <div>Gold: <span id="gold-display">0</span></div>
        <div>Rod: <span id="rod-display">Basic Rod</span></div>
        <div>Bait: <span id="bait-display">Small Bait</span></div>
        <div>Inventory: <span id="inventory-display">Small: 0, Medium: 0, Large: 0</span></div>
        <div>Controls: Arrow Keys/WASD to move boat | Mouse to cast | R to upgrade rod | B to change bait</div>
    </div>
    
    <script type="module" src="js/main.js"></script>
</body>
</html>
